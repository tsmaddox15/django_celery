# Settings and secrets live in .env (copy .env.example to start). Compose reads
# it twice: `env_file` hands every variable to the app containers, and the
# ${...} placeholders in this file are filled from it too.

# Locally the app logs in as sa, so its password is the sa password as well.
x-sa-password: &sa-password "${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}"

# Shared by everything built from this repo. A service can still override any of
# these keys, e.g. migrate and flower set their own depends_on.
x-app: &app
  build: .
  env_file: .env
  volumes:
    - .:/app:z
  depends_on:
    redis:
      condition: service_started
    migrate:
      condition: service_completed_successfully

services:
  # One-shot: everything that touches the ORM waits on this, so beat never starts
  # before the django_celery_beat tables exist.
  migrate:
    <<: *app
    container_name: django_migrate
    command: python manage.py migrate --noinput
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    restart: "no"

  web:
    <<: *app
    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  worker:
    <<: *app
    container_name: django_celery_worker_short
    command: celery -A mysite worker --loglevel=info -Q default --concurrency 2

  worker_automations:
    <<: *app
    container_name: django_celery_worker_long
    command: celery -A mysite worker --loglevel=info -Q automations --concurrency 3
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      selenium:
        condition: service_started

  beat:
    <<: *app
    container_name: django_celery_beat
    # The scheduler comes from CELERY_BEAT_SCHEDULER: the schedule is read from
    # SQL Server, so there is no local celerybeat-schedule file.
    command: celery -A mysite beat --loglevel=info

  flower:
    <<: *app
    container_name: django_celery_flower
    command: celery -A mysite flower --address=0.0.0.0 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker

  # Chrome for browser automations (my_app/browser.py). Tasks connect over
  # SELENIUM_REMOTE_URL. Watch the browsers live at http://localhost:7900
  # (password: secret).
  selenium:
    image: selenium/standalone-chromium:latest
    container_name: django_selenium
    # Chrome crashes with Docker's default 64MB of shared memory.
    shm_size: 2gb
    environment:
      # One browser per automations worker slot (--concurrency 3).
      SE_NODE_MAX_SESSIONS: 3
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    ports:
      - "4444:4444"
      - "7900:7900"

  redis:
    image: redis:7-alpine
    container_name: django_redis
    # Append-only mode writes every change to disk (synced once a second), so
    # queued tasks survive a restart or `docker compose down`. Without it Redis
    # only snapshots every few minutes.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: django_mssql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *sa-password
      # Read by sqlcmd, so the healthcheck doesn't need the password on its command line.
      SQLCMDPASSWORD: *sa-password
    volumes:
      - mssql_data:/var/opt/mssql
    # SQL Server takes 10-20s after the container starts before it accepts logins.
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-C", "-b", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Django can't create the database itself, so this one-shot does it before
  # anything runs migrations. It's a no-op once the database exists.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: django_mssql_init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: *sa-password
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - mssql
      - -U
      - sa
      - -C
      - -b
      - -Q
      - IF DB_ID('${DB_NAME:-mysite}') IS NULL CREATE DATABASE [${DB_NAME:-mysite}]
    restart: "no"

volumes:
  mssql_data:
  redis_data:
